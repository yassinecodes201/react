adapter: custom

setup: yarn install --frozen-lockfile

discover: node ../testpilot/tools/universal-coverage/src/runners/react-jest.js list

run: >-
  yarn --silent test
  --ci
  --runInBand
  --watch=false
  -r=experimental
  --env=development
  --sourceMaps
  --coverage
  --coverageReporters=json
  --coverageDirectory="{{COVERAGE_DIR}}"
  --runTestsByPath "{{TEST}}"

full: >-
  yarn test
  --ci
  --runInBand
  --watch=false
  -r=experimental
  --env=development

coverage:
  format: c8
  path: coverage/coverage-final.json